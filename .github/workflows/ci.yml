name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS (WordPress-VIP-Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPCS
        run: composer lint

      - name: Check that every phpcs:ignore still suppresses something
        run: |
          # A phpcs:ignore that has stopped matching is dead weight: it hides intent and
          # survives long after the finding it silenced is gone. Re-running with
          # annotations disabled should surface exactly one finding -- the documented
          # meta_value suppression in Index\rebuild(). Any other number means drift.
          count=$(vendor/bin/phpcs --ignore-annotations --report=summary \
            | grep -oE 'A TOTAL OF [0-9]+ ERRORS? AND [0-9]+ WARNINGS?' \
            | grep -oE '[0-9]+ WARNING' | grep -oE '^[0-9]+' || echo 0)
          echo "Findings hidden by phpcs:ignore: ${count:-0} (expected 1)"
          if [ "${count:-0}" -ne 1 ]; then
            echo "::error::Expected exactly 1 suppressed finding, found ${count:-0}. Review the phpcs:ignore comments."
            exit 1
          fi

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
        wordpress: [ '6.7' ]
        include:
          # Guard against breakage in an unreleased WordPress without failing the run.
          - php: '8.3'
            wordpress: 'trunk'
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_PASSWORD: ''
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Install Subversion
        # install-wp-tests.sh pulls the test suite from develop.svn.wordpress.org,
        # and svn is not present on the runner image by default.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends subversion

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Install the WordPress test suite
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1:3306 ${{ matrix.wordpress }}

      - name: Run PHPUnit
        run: composer test

  build:
    name: Build block assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the block manifest was emitted
        # Registration no-ops when build/ is missing, so a silently empty build would
        # otherwise ship a plugin whose block simply never appears.
        run: |
          test -f build/featured-list/block.json
          test -f build/featured-list/index.js
          test -f build/featured-list/index.asset.php
          echo "Block assets present."
